<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카템랭킹 추천템</title>
<meta name="description" content="카템랭킹 쇼츠에 나온 차량용품 구매 링크 모음">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0A1530; --card:#13224A; --line:rgba(255,255,255,.1); --ink:#fff; --sub:#9AA6C2; --gold:#FFC83D; --orange:#FF8A00; --red:#FF4D1F; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  header { text-align:center; padding:12px 0 18px; }
  header h1 { font-size:28px; font-weight:900; letter-spacing:-1px; }
  header h1 b { color:var(--gold); }
  header p { color:var(--sub); font-size:14px; margin-top:6px; }
  .find { display:flex; gap:8px; margin:6px 0 14px; }
  .find input { flex:1; background:var(--card); border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:12px 14px; font:inherit; font-size:16px; }
  .find input::placeholder { color:var(--sub); }
  .notice { font-size:12px; color:var(--sub); background:rgba(255,255,255,.04); border-radius:10px; padding:10px 12px; margin-bottom:18px; line-height:1.5; }
  .ep { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:16px; scroll-margin-top:12px; }
  .ep:target { border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,200,61,.25); }
  .ephead { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .no { background:var(--orange); color:#0A1530; font-weight:900; font-size:15px; padding:3px 10px; border-radius:999px; }
  .ephead h2 { font-size:19px; font-weight:900; flex:1; letter-spacing:-.5px; }
  .ephead time { color:var(--sub); font-size:12px; }
  .item { display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  .item:first-of-type { border-top:0; }
  .thumb { position:relative; flex:none; }
  .thumb img { width:84px; height:84px; border-radius:12px; object-fit:cover; background:#fff; display:block; }
  .rk { position:absolute; left:-6px; top:-6px; font-size:12px; font-weight:900; color:#0A1530; padding:2px 7px; border-radius:999px; }
  .r1 { background:#FFC83D; } .r2 { background:#D5DDE8; } .r3 { background:#E0965A; } .r4,.r5 { background:#9AA6C2; }
  .info { flex:1; min-width:0; }
  .nm { font-size:15px; font-weight:700; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .pr { margin-top:4px; font-size:13px; color:var(--sub); }
  .pr b { color:var(--gold); font-size:18px; font-weight:900; margin-right:6px; }
  .pr s { margin-right:6px; }
  .pr em { font-style:normal; color:var(--red); font-weight:900; }
  .buy { flex:none; background:var(--orange); color:#0A1530; text-decoration:none; font-weight:900; font-size:14px; padding:10px 12px; border-radius:12px; }
  .yt { display:inline-block; margin-top:8px; font-size:13px; color:var(--sub); }
  .empty { text-align:center; color:var(--sub); padding:40px 0; }
  footer { text-align:center; color:var(--sub); font-size:12px; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>카템<b>랭킹</b> 추천템</h1>
    <p>쇼츠 마지막 화면의 <b style="color:#FFC83D">#번호</b>를 찾아 주세요</p>
  </header>
  <div class="find"><input id="q" type="search" inputmode="search" placeholder="#번호 또는 상품 이름 (예: 12, 거치대)"></div>
  <div class="notice">이 페이지의 링크는 알리익스프레스 제휴 링크로, 구매 시 일정 수수료를 받을 수 있습니다. 가격은 각 영상 제작일 기준이며 변동될 수 있습니다.</div>
  <main id="list"><p class="empty">불러오는 중…</p></main>
  <footer>© 카템랭킹</footer>
</div>
<script>
const won = n => Number(n).toLocaleString('ko-KR');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let videos = [];

function render(q) {
  const list = document.getElementById('list');
  q = (q || '').trim().replace(/^#/, '');
  const shown = videos.filter(v => !q || String(v.no) === q ||
    v.title.includes(q) || v.items.some(it => it.name.includes(q)));
  if (!shown.length) { list.innerHTML = '<p class="empty">찾는 영상이 없어요</p>'; return; }
  list.innerHTML = shown.map(v => `
    <section class="ep" id="${v.no}">
      <div class="ephead"><span class="no">#${v.no}</span><h2>${esc(v.title)}</h2><time>${esc(v.date)}</time></div>
      ${[...v.items].sort((a, b) => a.rank - b.rank).map(it => {
        const off = it.original_price ? Math.round((1 - it.price / it.original_price) * 100) : 0;
        return `<div class="item">
          <div class="thumb"><img src="${esc(it.image)}" alt="" loading="lazy" referrerpolicy="no-referrer"><span class="rk r${it.rank}">${it.rank}위</span></div>
          <div class="info"><div class="nm">${esc(it.name)}</div>
            <div class="pr"><b>${won(it.price)}원</b>${off > 0 ? `<s>${won(it.original_price)}원</s><em>-${off}%</em>` : ''}</div></div>
          <a class="buy" href="${esc(it.link)}" target="_blank" rel="noopener nofollow sponsored">보러가기</a>
        </div>`;
      }).join('')}
      ${v.youtube ? `<a class="yt" href="${esc(v.youtube)}" target="_blank" rel="noopener">▶ 영상 다시 보기</a>` : ''}
    </section>`).join('');
}

fetch('data/videos.json', { cache: 'no-cache' })
  .then(r => r.json())
  .then(d => {
    videos = (d.videos || []).sort((a, b) => b.no - a.no);
    const hash = decodeURIComponent(location.hash.slice(1));
    render('');
    if (hash) document.getElementById(hash)?.scrollIntoView();
  })
  .catch(() => { document.getElementById('list').innerHTML = '<p class="empty">목록을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</p>'; });

document.getElementById('q').addEventListener('input', e => render(e.target.value));
</script>
</body>
</html>
